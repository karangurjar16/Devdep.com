# Nginx — Devdep Production Configuration
# Place this at: /etc/nginx/sites-available/devdep
# Then symlink: ln -s /etc/nginx/sites-available/devdep /etc/nginx/sites-enabled/

# ─── Upstream definitions ─────────────────────────────────────────────────────

upstream upload_api {
    keepalive 32;
    server 127.0.0.1:5000;
}

upstream request_server {
    keepalive 64;
    server 127.0.0.1:9000;
}

# ─── API Server (upload) ──────────────────────────────────────────────────────
# Handles: /auth/*, /github/*, /upload/*, /domain/*

server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect HTTP → HTTPS (uncomment after adding SSL cert via certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://upload_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # CORS is handled in Express — do not duplicate headers here
    }
}

# ─── Frontend (React/Vite) ────────────────────────────────────────────────────
# Serves the static build output from apps/web/dist/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/devdep/apps/web/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets — aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ─── Request / Reverse Proxy ──────────────────────────────────────────────────
# Handles subdomain-based routing (e.g., myapp.yourdomain.com)
# The request server itself does subdomain detection — nginx just proxies

server {
    listen 80;
    server_name *.yourdomain.com;

    location / {
        proxy_pass         http://request_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffers      16 4k;
        proxy_buffer_size  8k;
    }
}
